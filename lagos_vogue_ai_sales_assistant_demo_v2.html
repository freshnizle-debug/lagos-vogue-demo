<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Lagos Vogue AI Sales Assistant</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#e9edef;
  font-family:Arial,sans-serif;
  color:#202124
}
.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  background:#efe7de;
  display:flex;
  flex-direction:column
}
.header{
  background:#111;
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:3
}
.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#fff;
  color:#111;
  display:grid;
  place-items:center;
  font-weight:700
}
.header h1{
  font-size:16px;
  margin:0
}
.header p{
  font-size:11px;
  margin:3px 0 0;
  opacity:.7
}
.demo{
  background:#f8f1d8;
  color:#5b4b13;
  text-align:center;
  padding:7px;
  font-size:11px
}
.chat{
  padding:14px 12px 145px;
  flex:1
}
.row{
  display:flex;
  margin:8px 0
}
.row.user{
  justify-content:flex-end
}
.bubble{
  max-width:84%;
  padding:10px 12px;
  border-radius:12px;
  font-size:14px;
  line-height:1.42;
  box-shadow:0 1px 1px #0001;
  white-space:pre-wrap
}
.bot .bubble{
  background:#fff;
  border-top-left-radius:3px
}
.user .bubble{
  background:#d9fdd3;
  border-top-right-radius:3px
}
.time{
  font-size:9px;
  color:#777;
  text-align:right;
  margin-top:4px
}
.quick{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:8px 0
}
.quick button,
.actions button{
  border:1px solid #bbb;
  background:#fff;
  border-radius:18px;
  padding:8px 11px;
  font-size:12px;
  cursor:pointer
}
.quick button:hover,
.actions button:hover{
  background:#f1f1f1
}
.composer{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(760px,100%);
  background:#f0f2f5;
  padding:9px;
  display:flex;
  gap:7px;
  border-top:1px solid #ddd;
  z-index:4
}
.composer textarea{
  flex:1;
  resize:none;
  border:1px solid #ccd0d5;
  border-radius:20px;
  padding:11px 14px;
  font:14px Arial;
  min-height:44px;
  max-height:110px;
  outline:none
}
.composer button{
  border:0;
  border-radius:50%;
  width:46px;
  height:46px;
  background:#111;
  color:#fff;
  font-weight:700;
  cursor:pointer
}
.reset{
  margin:10px auto 4px;
  display:block;
  border:0;
  background:transparent;
  color:#555;
  text-decoration:underline;
  font-size:12px;
  cursor:pointer
}
.lead{
  background:#fff;
  border:1px solid #d8c77b;
  border-radius:12px;
  padding:14px;
  margin:16px 2px;
  box-shadow:0 2px 8px #0001
}
.lead h3{
  margin:0 0 10px;
  font-size:15px
}
.lead p{
  margin:6px 0;
  font-size:13px
}
.status{
  display:inline-block;
  padding:4px 8px;
  border-radius:12px;
  background:#ffe7a6;
  font-weight:700;
  font-size:11px
}
.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap
}
.actions button.primary{
  background:#111;
  color:#fff;
  border-color:#111
}
.sent{
  font-size:12px;
  color:#176b32;
  margin-top:8px;
  font-weight:700
}
.typing{
  display:inline-block;
  padding:9px 12px;
  background:#fff;
  border-radius:12px;
  color:#777;
  font-size:13px
}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin:12px 2px;
  box-shadow:0 2px 8px #0001
}
.card h3{
  margin:0 0 8px;
  font-size:15px
}
.card p{
  margin:5px 0;
  font-size:12px;
  color:#555
}
.price{
  font-weight:700;
  color:#111
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="avatar">LV</div>
  <div>
    <h1>Lagos Vogue AI Sales Assistant</h1>
    <p>Online • AI-powered fashion sales demo</p>
  </div>
</header>

<div class="demo">
  DEMO ENVIRONMENT — inventory, delivery and payment require team confirmation
</div>

<main class="chat" id="chat"></main>

<button class="reset" onclick="resetDemo()">Reset conversation</button>

<div class="composer">
  <textarea id="input" rows="1" placeholder="Type a customer message…"></textarea>
  <button id="send" aria-label="Send">➤</button>
</div>

</div>

<script>

const catalog = {
  native:{
    name:"Men’s Native Shirt & Trouser Set",
    price:50000,
    sizes:["M","L","XL","XXL"],
    colors:["Black","White","Navy","Brown"],
    description:"A smart native two-piece suitable for weddings, events and special occasions."
  },

  shirt:{
    name:"Smart Casual Men's Shirt",
    price:25000,
    sizes:["M","L","XL","XXL"],
    colors:["White","Black","Sky Blue","Wine"],
    description:"A clean smart-casual shirt suitable for work, outings and social occasions."
  }
};

let s = {
  gender:null,
  product:null,
  size:null,
  color:null,
  budget:null,
  occasion:null,
  name:null,
  location:null,
  timeline:null,
  leadSent:false
};

function add(text,who){

  const row=document.createElement("div");
  row.className="row "+who;

  const b=document.createElement("div");
  b.className="bubble";

  const message=document.createElement("span");
  message.textContent=text;

  const t=document.createElement("div");
  t.className="time";
  t.textContent=new Date().toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });

  b.appendChild(message);
  b.appendChild(t);
  row.appendChild(b);

  document.getElementById("chat").appendChild(row);

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });
}

function quick(items){

  const box=document.createElement("div");
  box.className="quick";

  items.forEach(x=>{

    const b=document.createElement("button");

    b.textContent=x;

    b.onclick=()=>{
      send(x);
    };

    box.appendChild(b);

  });

  document.getElementById("chat").appendChild(box);

}

function productCard(){

  const box=document.createElement("div");
  box.className="card";

  box.innerHTML=`
    <h3>${catalog.native.name}</h3>
    <p class="price">Reference price: ₦50,000</p>
    <p>${catalog.native.description}</p>
    <p>Sizes: M, L, XL, XXL</p>
    <p>Colours: Black, White, Navy, Brown</p>
  `;

  document.getElementById("chat").appendChild(box);
}

function send(text){

  text=(text||"").trim();

  if(!text)return;

  add(text,"user");

  document.getElementById("input").value="";

  route(text);
}

function route(raw){

  const t=raw.toLowerCase();

  /*
   STEP 1 — CUSTOMER TYPE
  */

  if(!s.gender){

    if(
      t.includes("men") ||
      t.includes("man") ||
      t.includes("male")
    ){
      s.gender="men";
    }

    else if(
      t.includes("women") ||
      t.includes("woman") ||
      t.includes("female")
    ){
      s.gender="women";
    }

    else{

      add(
        "Absolutely 😊 Is the outfit for a man or a woman?",
        "bot"
      );

      quick(["Man","Woman"]);

      return;
    }
  }

  /*
   WOMEN'S FLOW
  */

  if(s.gender==="women"){

    add(
      "Great 😊. Lagos Vogue can assist with women's fashion too. This demo catalogue is currently focused on selected men's pieces.\n\nTell me the occasion and your approximate budget, and the boutique team can recommend suitable options.",
      "bot"
    );

    return;
  }

  /*
   STEP 2 — PRODUCT
  */

  if(!s.product){

    const match=raw.match(/₦\s?([\d,]+)/);

    if(match){
      s.budget=parseInt(
        match[1].replace(/,/g,"")
      );
    }else{
      s.budget=50000;
    }

    if(
      t.includes("wedding") ||
      t.includes("marriage")
    ){
      s.occasion="Wedding";
    }

    else if(
      t.includes("church") ||
      t.includes("service")
    ){
      s.occasion="Church";
    }

    else if(
      t.includes("birthday")
    ){
      s.occasion="Birthday";
    }

    else if(
      t.includes("office") ||
      t.includes("work")
    ){
      s.occasion="Work";
    }

    else{
      s.occasion="Special occasion";
    }

    s.product=catalog.native;

    productCard();

    add(
      "For your request, the "+s.product.name+
      " is currently listed at a reference price of ₦50,000.\n\n"+
      "This is a demo catalogue price, not live inventory. The boutique team must confirm availability before purchase.\n\n"+
      "What size do you normally wear?",
      "bot"
    );

    quick(["M","L","XL","XXL"]);

    return;
  }

  /*
   STEP 3 — SIZE
  */

  if(!s.size){

    const size=["M","L","XL","XXL"]
      .find(x=>
        new RegExp("\\b"+x+"\\b","i").test(t)
      );

    if(size){

      s.size=size.toUpperCase();

      add(
        "Noted 👍🏽. You selected size "+
        s.size+
        ". What colour would you prefer?",
        "bot"
      );

      quick(s.product.colors);

      return;
    }

    add(
      "Please choose your usual size: M, L, XL or XXL.",
      "bot"
    );

    quick(["M","L","XL","XXL"]);

    return;
  }

  /*
   STEP 4 — COLOUR
  */

  if(!s.color){

    const c=s.product.colors.find(
      x=>t.includes(x.toLowerCase())
    );

    if(c){

      s.color=c;

      add(
        "Great choice 👍🏽. What is your name and location?\n\nFor example: Friday, Lagos.",
        "bot"
      );

      return;
    }

    add(
      "Which colour would you prefer?",
      "bot"
    );

    quick(s.product.colors);

    return;
  }

  /*
   STEP 5 — NAME + LOCATION
  */

  if(!s.name){

    const parts=raw.split(",");

    if(parts.length>=2){

      s.name=parts[0].trim();

      s.location=parts
        .slice(1)
        .join(",")
        .trim();

      askTimeline();

      return;
    }

    add(
      "Please send your name and location in this format:\n\nFriday, Lagos",
      "bot"
    );

    return;
  }

  /*
   STEP 6 — TIMELINE
  */

  if(!s.timeline){

    if(
      t.includes("today") ||
      t.includes("asap") ||
      t.includes("urgent")
    ){
      s.timeline="ASAP";
    }

    else if(t.includes("week")){
      s.timeline="This week";
    }

    else if(
      t.includes("compare") ||
      t.includes("just looking")
    ){
      s.timeline="Just comparing";
    }

    else{
      s.timeline=raw;
    }

    add(
      "Thanks, "+s.name+" 😊.\n\n"+
      "I have your request. Would you like me to prepare it as a sales lead for the Lagos Vogue boutique team to confirm stock, delivery and payment details?",
      "bot"
    );

    quick([
      "Yes, pass it to the team",
      "Not yet"
    ]);

    return;
  }

  /*
   STEP 7 — SEND LEAD
  */

  if(
    t.includes("yes") ||
    t.includes("pass") ||
    t.includes("send")
  ){

    showLead();

  }

  else{

    add(
      "No problem 👍🏽. I won't send the lead yet. You can continue asking questions, or choose 'Yes, pass it to the team' when you're ready.",
      "bot"
    );

    quick([
      "Yes, pass it to the team"
    ]);
  }
}

function askTimeline(){

  add(
    "Thanks 😊. When are you hoping to buy it?",
    "bot"
  );

  quick([
    "As soon as possible",
    "This week",
    "Just comparing"
  ]);
}

function showLead(){

  if(document.getElementById("lead"))return;

  add(
    "Perfect 😊 I've captured the request.\n\n"+
    "The boutique team will need to confirm availability, any applicable discount, delivery to your location and approved payment details.",
    "bot"
  );

  const lead=document.createElement("section");

  lead.className="lead";
  lead.id="lead";

  lead.innerHTML=`

    <h3>🔔 INTERNAL SALES LEAD</h3>

    <p>
      <span class="status">HOT LEAD</span>
    </p>

    <p>
      <b>Customer:</b>
      ${esc(s.name)}
    </p>

    <p>
      <b>Product:</b>
      ${esc(s.product.name)}
    </p>

    <p>
      <b>Size:</b>
      ${esc(s.size)}
    </p>

    <p>
      <b>Colour:</b>
      ${esc(s.color)}
    </p>

    <p>
      <b>Budget:</b>
      ₦${Number(s.budget||50000).toLocaleString()}
    </p>

    <p>
      <b>Occasion:</b>
      ${esc(s.occasion)}
    </p>

    <p>
      <b>Location:</b>
      ${esc(s.location)}
    </p>

    <p>
      <b>Timeline:</b>
      ${esc(s.timeline)}
    </p>

    <p>
      <b>Intent:</b>
      Ready to purchase / confirmation required
    </p>

    <p>
      <b>Recommended action:</b>
      Confirm ${esc(s.size)} availability, approved price or discount,
      delivery options and official payment details.
    </p>

    <div class="actions">

      <button
        class="primary"
        onclick="sendLead()">
        📩 Send Lead to Boutique
      </button>

      <button
        onclick="copyLead()">
        Copy Lead
      </button>

    </div>

    <div id="leadStatus"></div>

    <p style="font-size:10px;color:#777;margin-top:12px">
      DEMO ONLY — sending currently simulates the sales workflow.
      No real message is sent.
    </p>

  `;

  document
    .getElementById("chat")
    .appendChild(lead);

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });
}

function sendLead(){

  s.leadSent=true;

  document.getElementById("leadStatus").innerHTML=
    '<div class="sent">✓ Lead sent to Lagos Vogue boutique team — simulated demo action</div>';
}

function copyLead(){

  const txt=
`NEW LAGOS VOGUE SALES LEAD

Customer: ${s.name}
Product: ${s.product.name}
Size: ${s.size}
Colour: ${s.color}
Budget: ₦${Number(s.budget||50000).toLocaleString()}
Occasion: ${s.occasion}
Location: ${s.location}
Timeline: ${s.timeline}

ACTION:
Confirm stock, approved price/discount, delivery and payment details.`;

  if(navigator.clipboard){

    navigator.clipboard
      .writeText(txt)
      .then(()=>{
        document.getElementById("leadStatus").innerHTML=
          '<div class="sent">✓ Lead copied to clipboard</div>';
      })
      .catch(()=>{
        document.getElementById("leadStatus").innerHTML=
          '<div class="sent">✓ Lead prepared. Clipboard permission was unavailable.</div>';
      });

  }else{

    document.getElementById("leadStatus").innerHTML=
      '<div class="sent">✓ Lead prepared for copying.</div>';

  }
}

function esc(x){

  return String(x||"")
    .replace(
      /[&<>"']/g,
      m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#39;"
      }[m])
    );
}

function resetDemo(){

  s={
    gender:null,
    product:null,
    size:null,
    color:null,
    budget:null,
    occasion:null,
    name:null,
    location:null,
    timeline:null,
    leadSent:false
  };

  document.getElementById("chat").innerHTML="";

  add(
    "Hello 😊 Welcome to Lagos Vogue.\n\n"+
    "I'm your AI Sales Assistant. I can help you explore our catalogue, identify what you need, collect your purchase request and prepare a qualified sales lead for our boutique team.\n\n"+
    "What are you shopping for?",
    "bot"
  );

  quick([
    "Men's outfit",
    "Women's outfit",
    "I need an outfit for a wedding"
  ]);
}

document.getElementById("send").onclick=()=>{
  send(document.getElementById("input").value);
};

document
  .getElementById("input")
  .addEventListener("keydown",e=>{

    if(e.key==="Enter" && !e.shiftKey){

      e.preventDefault();

      send(e.target.value);
    }

  });

resetDemo();

</script>

</body>
</html>
